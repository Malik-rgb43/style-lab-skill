<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetic composition</title>
<style>
@font-face { font-family: "Karantina"; src: url("fonts/Karantina-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Heebo"; src: url("fonts/Heebo-Variable.ttf"); font-weight: 100 900; }
:root {
  --ink: #0b0b12;
  --paper: #f5f2ea;
  --accent: #7c3aed;
  --accent-soft: var(--accent);
  --pill: var(--ink);
}
body { margin: 0; width: 1920px; height: 1080px; background: var(--ink); color: var(--paper); font-family: "Heebo", sans-serif; font-weight: 400; }
.headline { font-family: "Karantina", cursive; font-size: 120px; font-weight: 700; color: var(--accent-soft); line-height: 0.95; letter-spacing: -1px; }
.body-text { font-family: "Heebo", sans-serif; font-size: 48px; font-weight: 500; color: var(--paper); line-height: 1.3; }
.caption { font-family: "Heebo", sans-serif; font-size: 40px; font-weight: 800; color: #ffffff; background: var(--pill); line-height: 1.2; }
.note { font-family: "Gveret Levin", cursive; font-size: 32px; font-weight: 400; color: var(--accent); }
.card { background: var(--accent); border-color: var(--paper); }
</style>
</head>
<body>
<div id="stage" data-composition-id="demo" data-width="1920" data-height="1080">
  <h1 class="headline" id="h1">Title</h1>
  <p class="body-text">Body line one</p>
  <p class="body-text">Body line two</p>
  <span class="caption">caption</span>
  <span class="note">side note</span>
  <div class="card"></div>
  <audio id="bed" src="assets/music-bed.mp3" data-start="0" data-volume="0.35"></audio>
  <audio id="hit" src="assets/hit.wav" data-start="1.2"></audio>
</div>
<script>
  CustomEase.create("snap", "M0,0 C0.2,0.9 0.1,1 1,1");
  const tl = gsap.timeline({ paused: true });
  tl.from(".headline", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0);
  tl.to(".body-text", { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.4);
  tl.fromTo(".caption", { scale: 0.8 }, { scale: 1, duration: 0.3, ease: "snap" }, 1.0);
  tl.to(".card", { rotation: 4, duration: 1.2, ease: "snap" }, 1.2);
  tl.set(".note", { opacity: 1 }, 2.0);
  window.__timelines = { demo: tl };
</script>
</body>
</html>
