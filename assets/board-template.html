<meta charset="utf-8">
<title>Style Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: a design-tool canvas. Sticky page list on the left (like Figma's Layers → Pages),
   grey canvas on the right with one panel per scene category: example grid + annotated breakdowns + the four "why" questions. */
:root{
  --canvas:#e6e7ea; --panel:#d9dadf; --paper:#fbfbfc; --ink:#121317; --muted:#666b75; --line:#cfd2d8;
  --side:#26272b; --side-ink:#e9eaee; --side-muted:#9a9ca4; --side-on:#2c6ed5;
  --callout:#e5483b; --accent:#2f9bf0;
  --sans:"Inter","Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Playfair Display",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#16171a; --panel:#202227; --paper:#1a1c21; --ink:#eceef2; --muted:#9ba0aa; --line:#30333b;
  --side:#0f1012; --side-ink:#e9eaee; --side-muted:#8a8d95; --side-on:#2c6ed5; --callout:#ff6a5c; --accent:#4aa9f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#16171a; --panel:#202227; --paper:#1a1c21; --ink:#eceef2; --muted:#9ba0aa; --line:#30333b;
  --side:#0f1012; --side-ink:#e9eaee; --side-muted:#8a8d95; --side-on:#2c6ed5; --callout:#ff6a5c; --accent:#4aa9f5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
nav{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;
  padding-left:max(12px,env(safe-area-inset-left,0px))}
nav .t{font-weight:600;padding:4px 10px 12px;display:flex;gap:16px} nav .t span{color:var(--side-muted);font-weight:500}
nav .pg{color:var(--side-muted);font-size:12px;padding:8px 10px 4px}
nav a{display:flex;gap:10px;align-items:center;color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:7px;font-size:13.5px}
nav a::before{content:"#";color:var(--side-muted)}
nav a:hover{background:rgba(255,255,255,.06)} nav a.on{background:var(--side-on)}
main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:34px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.03em;line-height:1.05}
h1 em{font-family:var(--serif);font-weight:500;color:var(--accent)}
.sub{color:var(--muted);margin-top:6px;max-width:70ch}
.btn{font:inherit;font-weight:600;border:0;background:var(--accent);color:#fff;border-radius:9px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.tile:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border-radius:4px;padding:clamp(16px,2.6vw,34px);scroll-margin-top:16px}
.panel h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.panel .count{color:var(--muted);font-size:13px}
.panel .rule{color:var(--ink);opacity:.85;margin:10px 0 0;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:18px}
.tile{aspect-ratio:9/16;max-width:100%;border:0;padding:0;border-radius:3px;background:#111 center/cover no-repeat;cursor:pointer;position:relative;color:#fff;font:inherit;font-size:11px}
.tile span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:3px}
.tile.empty{background:repeating-linear-gradient(135deg,var(--paper) 0 8px,var(--line) 8px 9px);color:var(--muted)}
.tile.empty span{background:transparent;color:var(--muted)}
.ann-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:26px;margin-top:26px}
.ann{display:grid;grid-template-columns:150px minmax(0,1fr);gap:28px;align-items:center;position:relative;background:var(--paper);border-radius:6px;padding:16px}
.ann .frame{aspect-ratio:9/16;max-width:100%;border-radius:3px;background:#111 center/cover no-repeat;position:relative}
.ann .frame i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--callout);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(229,72,59,.25)}
.ann ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.ann li{font-size:14.5px;line-height:1.3;position:relative;z-index:1}
.ann svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ann path{fill:none;stroke:var(--callout);stroke-width:1.6}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-top:24px}
.why label{display:block;font-weight:600;margin-bottom:6px}
.why label em{font-family:var(--serif);font-weight:500;color:var(--accent)}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tokens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:18px}
.tok{background:var(--paper);border-radius:6px;padding:16px;min-width:0}
.tok h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw div{width:64px}
.sw b{display:block;height:44px;border-radius:6px;border:1px solid var(--line)}
.sw small{display:block;font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all}
.font-sample{font-size:26px;line-height:1.15;margin:4px 0}
.tok p{margin:6px 0 0;font-size:13.5px}
dialog{border:0;border-radius:14px;padding:0;max-width:min(980px,94vw);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.6)}
.dlg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding:20px}
.dlg video{width:100%;aspect-ratio:9/16;background:#000;border-radius:8px}
.dlg img{width:100%;border-radius:6px}
.dlg pre{white-space:pre-wrap;font:13px/1.5 var(--sans);margin:0}
.dlg .x{position:absolute;right:12px;top:10px}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}nav .t,nav .pg{width:100%}.ann{grid-template-columns:110px minmax(0,1fr)}.dlg{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="shell">
  <nav aria-label="Pages"><div class="t">Layers <span>Assets</span></div><div class="pg">Pages</div><div id="pages"></div></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><button class="btn ghost x" type="button" id="dlg-x">Close</button><div class="dlg" id="dlg-body"></div></dialog>

<!-- Claude fills this block from the style's board.json.
     tiles: library animations (thumb = published image path; clip/strip/notes optional for the detail view).
     annotations: x,y are percent positions on the frame; each callout's label is one measurable rule. -->
<script type="application/json" id="board-data">
{
  "example": true,
  "style": "Minimal premium",
  "subtitle": "Example board: the categories and rules below are placeholders until the style is trained on its reference videos.",
  "tokens": {
    "fonts": [{"name":"Inter","role":"Main text: light and bold sans","sample":"really common","css":"font-family:Inter;font-weight:800"},
              {"name":"Playfair Display Italic","role":"Special word: serif italic","sample":"wind down","css":"font-family:'Playfair Display';font-style:italic"}],
    "colors": [{"hex":"#1F3FE0","name":"Azure blue"},{"hex":"#F2F0EB","name":"Paper white"},{"hex":"#0B0B0D","name":"Ink black"}],
    "textures": ["Light paper grain on white and black grounds","Rough cloth / paint texture behind characters"],
    "shapes": ["Thin glowing white lines","Thick azure arcs","Small blue dot as the line's head"],
    "sizing": ["Bold word ≈ 2–3× the light line","Light line spacing = 75% of the bold word's width"],
    "layout": ["Captions sit low-centre on A-roll","Cut-aways are centred, one idea per frame"]
  },
  "categories": [
    {"id":"captions","name":"On-Screen Text (Captions)","rule":"Two fonts with placement logic: small light sans around one big bold word; the special word switches to serif italic.",
     "tiles":[{"id":"V01-A01","label":"common"},{"id":"V02-A03","label":"freaking"},{"id":"V04-A02","label":"opposite"},{"id":"V07-A01","label":"won"}],
     "annotations":[{"thumb":"","callouts":[{"x":50,"y":63,"label":"Multiple sans light small text"},{"x":50,"y":71,"label":"Singular or double bold sans text"},{"x":40,"y":78,"label":"Distance of the light sans text is 75% of the big bold text"}]}],
     "why":{"design":"","colors":"","effects":"","animations":""}},
    {"id":"line-text","name":"Line + Text Animations","rule":"A single thick azure line draws in sync with the words; the text lands where the line stops.",
     "tiles":[{"id":"V05-A03","label":"positive"},{"id":"V05-A04","label":"to normal"}],
     "annotations":[{"thumb":"","callouts":[{"x":30,"y":35,"label":"Black or white paper background"},{"x":60,"y":30,"label":"Thick azure line, draws over ~0.6 s"},{"x":50,"y":55,"label":"Light/bold caption pair where the line ends"}]}],
     "why":{"design":"","colors":"","effects":"","animations":""}}
  ]
}
</script>

<script>
(function(){
  const data = JSON.parse(document.getElementById('board-data').textContent);
  const KEY = 'board:' + data.style;
  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { notes = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch(e) {} };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const main = document.getElementById('main'), pages = document.getElementById('pages');
  const WHY = [["design","Why this <em>design?</em>"],["colors","Why these <em>colors?</em>"],["effects","Why these <em>effects?</em>"],["animations","Why these <em>animations?</em>"]];

  const top = document.createElement('div'); top.className = 'top';
  top.innerHTML = `<div><h1>${esc(data.style)} <em>style board</em></h1><div class="sub">${esc(data.subtitle || '')}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="copy" type="button">Copy board notes</button></div>`;
  main.appendChild(top);

  const link = (id, name) => { const a = document.createElement('a'); a.href = '#' + id; a.textContent = name; a.dataset.id = id; pages.appendChild(a); };
  link('full', 'Full Inspiration Board');

  const t = data.tokens || {};
  const full = document.createElement('section'); full.className = 'panel'; full.id = 'full';
  const allTiles = data.categories.flatMap(c => c.tiles.map(x => Object.assign({cat:c.name}, x)));
  full.innerHTML = `<h2>Full Inspiration Board</h2><div class="count">${allTiles.length} references · ${data.categories.length} categories</div>
    <div class="tokens">
      <div class="tok"><h3>Fonts</h3>${(t.fonts||[]).map(f => `<div class="font-sample" style="${esc(f.css)}">${esc(f.sample)}</div><p><b>${esc(f.name)}</b> · ${esc(f.role)}</p>`).join('')}</div>
      <div class="tok"><h3>Colours</h3><div class="sw">${(t.colors||[]).map(c => `<div><b style="background:${esc(c.hex)}"></b><small>${esc(c.name)}<br>${esc(c.hex)}</small></div>`).join('')}</div></div>
      ${['textures','shapes','sizing','layout'].map(k => `<div class="tok"><h3>${k}</h3>${(t[k]||[]).map(x => `<p>${esc(x)}</p>`).join('')}</div>`).join('')}
    </div><div class="grid" id="grid-full"></div>`;
  main.appendChild(full);

  function tile(x){
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'tile' + (x.thumb ? '' : ' empty');
    if (x.thumb) b.style.backgroundImage = `url('${x.thumb}')`;
    b.innerHTML = `<span>${esc(x.id)}${x.label ? ' · ' + esc(x.label) : ''}</span>`;
    b.setAttribute('aria-label', `${x.id} ${x.label || ''}`);
    b.onclick = () => open(x);
    return b;
  }
  allTiles.forEach(x => document.getElementById('grid-full').appendChild(tile(x)));

  data.categories.forEach(c => {
    link(c.id, c.name);
    const p = document.createElement('section'); p.className = 'panel'; p.id = c.id;
    notes[c.id] = notes[c.id] || {};
    p.innerHTML = `<h2 dir="auto">${esc(c.name)}</h2><div class="count">${c.tiles.length} references</div>
      ${c.rule ? `<p class="rule" dir="auto">${esc(c.rule)}</p>` : ''}
      <div class="grid"></div>
      <div class="ann-row">${(c.annotations||[]).map((a,i) => `
        <div class="ann" data-i="${i}"><div class="frame" style="${a.thumb ? `background-image:url('${esc(a.thumb)}')` : ''}">${a.callouts.map(k => `<i style="left:${k.x}%;top:${k.y}%"></i>`).join('')}</div>
          <ol>${a.callouts.map(k => `<li dir="auto">${esc(k.label)}</li>`).join('')}</ol><svg aria-hidden="true"></svg></div>`).join('')}</div>
      <div class="why">${WHY.map(([k, l]) => `<div><label for="w-${c.id}-${k}">${l}</label>
        <textarea id="w-${c.id}-${k}" dir="auto" data-k="${k}">${esc(notes[c.id][k] ?? (c.why||{})[k] ?? '')}</textarea></div>`).join('')}</div>`;
    main.appendChild(p);
    c.tiles.forEach(x => p.querySelector('.grid').appendChild(tile(Object.assign({cat:c.name}, x))));
    p.querySelectorAll('textarea').forEach(ta => ta.addEventListener('input', () => { notes[c.id][ta.dataset.k] = ta.value; save(); }));
  });

  function drawCallouts(){
    document.querySelectorAll('.ann').forEach(ann => {
      const svg = ann.querySelector('svg'), box = ann.getBoundingClientRect();
      const dots = ann.querySelectorAll('.frame i'), labels = ann.querySelectorAll('li');
      let d = '';
      dots.forEach((dot, i) => {
        const a = dot.getBoundingClientRect(), l = labels[i] && labels[i].getBoundingClientRect();
        if (!l) return;
        const x1 = a.left + a.width/2 - box.left, y1 = a.top + a.height/2 - box.top;
        const x2 = l.left - 8 - box.left, y2 = l.top + l.height/2 - box.top;
        const mx = x1 + (x2 - x1) * .55;
        d += `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2} `;
      });
      svg.innerHTML = `<path d="${d}"/>`;
    });
  }
  drawCallouts(); addEventListener('resize', drawCallouts);
  if (document.fonts) document.fonts.ready.then(drawCallouts);

  const dlg = document.getElementById('dlg'), body = document.getElementById('dlg-body');
  function open(x){
    body.innerHTML = `${x.clip ? `<video src="${esc(x.clip)}" controls autoplay muted loop playsinline></video>` : (x.thumb ? `<img src="${esc(x.thumb)}" alt="">` : '<div class="tile empty" style="cursor:default"><span>no media yet</span></div>')}
      <div style="min-width:0"><h2 style="margin:0 0 4px">${esc(x.id)}</h2><div class="count">${esc(x.cat || '')}</div>
      ${x.strip ? `<img src="${esc(x.strip)}" alt="every frame of the animation" style="margin-top:12px">` : ''}
      ${x.notes ? `<pre dir="auto" style="margin-top:12px">${esc(x.notes)}</pre>` : ''}</div>`;
    if (dlg.showModal) dlg.showModal();
  }
  document.getElementById('dlg-x').onclick = () => dlg.close();

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) pages.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === e.target.id));
  }), {rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('.panel').forEach(p => io.observe(p));
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }

  const copy = document.getElementById('copy');
  copy.onclick = () => {
    const L = [`# ${data.style} — board notes`, ''];
    data.categories.forEach(c => {
      L.push(`## ${c.name}`);
      WHY.forEach(([k]) => { const v = (notes[c.id][k] ?? (c.why||{})[k] ?? '').trim(); if (v) L.push(`- Why ${k}: ${v}`); });
      L.push('');
    });
    const txt = L.join('\n');
    const ok = () => { copy.textContent = '✓ Copied — paste it to Claude'; setTimeout(() => copy.textContent = 'Copy board notes', 2600); };
    const fb = () => { let ta = document.getElementById('board-out'); if (!ta) { ta = document.createElement('textarea'); ta.id = 'board-out'; top.appendChild(ta); } ta.value = txt; ta.select(); };
    navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt).then(ok, fb) : fb();
  };
})();
</script>
