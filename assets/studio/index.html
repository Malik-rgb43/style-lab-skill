<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סטודיו סגנון</title>
<link rel="stylesheet" href="/static/app.css">
<style>
/* Studio additions on top of the direction A shell */
.thbox img,.thbox video{width:100%;height:100%;object-fit:cover;display:block}
.thbox.ph{background:var(--surface2);color:var(--dim);font-size:12px}
.opt .fr{aspect-ratio:9/16;object-fit:cover;background:var(--surface2);border-radius:8px}
.opt .fr.h{aspect-ratio:16/9}
.list{display:flex;flex-direction:column;gap:8px}
.row-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row-item .grow{flex:1;min-width:0}
.row-item p{color:var(--muted);font-size:12.5px}
.row-item .acts{display:flex;gap:6px;flex:none}
.empty{padding:40px;border:1px dashed var(--line2);border-radius:12px;text-align:center;color:var(--dim)}
.toast{position:fixed;inset-block-end:18px;inset-inline-start:50%;translate:-50% 0;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.steps{display:flex;gap:6px;margin-bottom:14px}
.note-in{width:100%;height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 10px;font:inherit;color:inherit}
.probs{padding:9px 12px;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-size:12.5px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mk">S</span><div><b>סטודיו סגנון</b><small>style-lab</small></div></div>
    <div class="grp"><h4>ספרייה</h4>
      <nav class="nav" id="nav">
        <button class="ni" data-go="styles">סגנונות <span class="ct" id="ct-styles"></span></button>
        <button class="ni" data-go="clients">לקוחות <span class="ct" id="ct-clients"></span></button>
        <button class="ni" data-go="ideas">רעיונות <span class="ct" id="ct-ideas"></span></button>
        <button class="ni" data-go="learning">למידה <span class="bd" id="ct-learning" hidden></span></button>
        <button class="ni" data-go="projects">פרויקטים <span class="ct" id="ct-projects"></span></button>
      </nav>
    </div>
    <div class="side-foot"><div class="conn-box" id="conn"></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <button class="ib" id="reload" type="button" title="רענון" aria-label="רענון">↻</button>
      <button class="ib" id="theme" type="button" title="ערכת צבע" aria-label="ערכת צבע">◐</button>
    </header>
    <section class="screen" id="screen"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
